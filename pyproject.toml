[project]
name = "postpilot"
version = "0.1.0"
description = "Multi-agent LangGraph pipeline that drafts daily posts per platform for human review."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2",
    "langgraph-checkpoint-postgres>=3.1",
    "langchain>=1.4",
    "langchain-ollama>=1.1",
    "langchain-openai>=1.7",
    "langchain-anthropic>=1.7",
    "langchain-groq>=1.1",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",
    "numpy>=1.26",
    "python-telegram-bot[job-queue,rate-limiter]>=22.0",
    "apscheduler>=3.10,<4",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
postpilot = "postpilot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
